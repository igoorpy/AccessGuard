server:
  port: 0

spring:
  application:
    name: accessguard-test
  thymeleaf:
    cache: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  sql:
    init:
      mode: always

accessguard:
  jwt:
    secret: test-secret-key-for-testing-purposes-only-32-chars-minimum
    expiration: 1800000

logging:
  level:
    com.accessguard: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: WARN