<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6" lang="pt-BR"
      th:replace="~{fragments/layout :: layout(${isEdit ? 'Editar Usuário' : 'Novo Usuário'}, ~{::content})}">
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h1 class="mb-0" th:text="${isEdit ? 'Editar Usuário' : 'Novo Usuário'}"></h1>
        <a href="/admin/usuarios" class="btn btn-outline-secondary" data-testid="btn-voltar">
            <i class="bi bi-arrow-left me-2"></i> Voltar
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="${isEdit ? '/admin/usuarios/' + usuarioId + '/editar' : '/admin/usuarios/novo'}" method="post" data-testid="usuario-form">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="email" name="email"
                               th:value="${usuario.email}"
                               th:readonly="${isEdit}"
                               required data-testid="input-email" placeholder="usuario@empresa.com">
                        <div class="form-text" th:if="${isEdit}">O email não pode ser alterado após a criação.</div>
                    </div>
                    <div class="col-md-6">
                        <label for="nome" class="form-label">Nome <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nome" name="nome"
                               th:value="${usuario.nome}"
                               required data-testid="input-nome" placeholder="Nome completo">
                    </div>
                    <div class="col-md-4">
                        <label for="role" class="form-label">Perfil <span class="text-danger">*</span></label>
                        <select class="form-select" id="role" name="role" required data-testid="select-role">
                            <option value="">Selecione</option>
                            <option th:each="r : ${roles}" th:value="${r}" th:selected="${usuario.role == r}" th:text="${r}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="status" class="form-label">Status <span class="text-danger">*</span></label>
                        <select class="form-select" id="status" name="status" required data-testid="select-status">
                            <option value="">Selecione</option>
                            <option th:each="s : ${statuses}" th:value="${s}" th:selected="${usuario.status == s}" th:text="${s}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="senha" class="form-label">Senha <span class="text-danger" th:unless="${isEdit}">*</span><span th:if="${isEdit}"> (deixe em branco para não alterar)</span></label>
                        <input type="password" class="form-control" id="senha" name="senha"
                               th:required="${not isEdit}"
                               data-testid="input-senha" placeholder="Mínimo 8 caracteres">
                        <div class="form-text">Mínimo 8 caracteres. <span th:if="${isEdit}">Deixe em branco para manter a senha atual.</span></div>
                    </div>
                </div>
                <hr style="border-color: var(--border-color); margin: 1.5rem 0;">
                <div class="d-flex justify-content-end gap-2">
                    <a href="/admin/usuarios" class="btn btn-outline-secondary" data-testid="btn-cancelar">Cancelar</a>
                    <button type="submit" class="btn btn-primary" data-testid="btn-salvar">
                        <i class="bi bi-save me-2"></i> <span th:text="${isEdit ? 'Atualizar' : 'Criar'}"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</html>
