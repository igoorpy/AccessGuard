<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Negado - AccessGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; min-height: 100vh; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
    <div class="card shadow-lg" style="max-width: 500px;">
        <div class="card-body p-5 text-center">
            <i class="bi bi-shield-exclamation text-danger" style="font-size: 4rem;"></i>
            <h2 class="mt-3 mb-3">Acesso Negado</h2>
            <p class="text-muted mb-4">Você não tem permissão para acessar esta página.</p>
            <a href="/dashboard" class="btn btn-primary" data-testid="btn-voltar-dashboard">
                <i class="bi bi-house"></i> Voltar ao Dashboard
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
