<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Negado - AccessGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-primary: #38bdf8;
            --accent-primary-hover: #0ea5e9;
            --danger: #ef4444;
            --radius-lg: 1rem;
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; color: var(--text-primary); }
        .error-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); box-shadow: var(--shadow-xl), 0 0 0 1px rgba(239, 68, 68, 0.1); max-width: 500px; width: 100%; overflow: hidden; }
        .error-header { background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(239, 68, 68, 0.05)); border-bottom: 1px solid var(--border-color); padding: 3rem 2rem 2rem; text-align: center; }
        .error-header .icon { width: 100px; height: 100px; border-radius: 1.5rem; background: linear-gradient(135deg, var(--danger), #dc2626); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; box-shadow: 0 8px 24px rgba(239, 68, 68, 0.3); }
        .error-header .icon i { font-size: 3rem; color: white; }
        .error-header h2 { color: var(--text-primary); font-weight: 700; font-size: 1.75rem; margin-bottom: 0.5rem; }
        .error-header p { color: var(--text-secondary); font-size: 1rem; margin: 0; }
        .error-body { padding: 2rem 2rem 3rem; text-align: center; }
        .btn-primary { background: linear-gradient(135deg, var(--accent-primary), var(--accent-primary-hover)); border: none; border-radius: 0.5rem; padding: 0.875rem 2rem; font-weight: 600; font-size: 0.9375rem; transition: all 0.2s ease; }
        .btn-primary:hover { background: linear-gradient(135deg, var(--accent-primary-hover), #0284c7); transform: translateY(-1px); box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3); }
        .btn-primary:active { transform: translateY(0); }
    </style>
</head>
<body>
    <div class="card error-card">
        <div class="error-header">
            <div class="icon">
                <i class="bi bi-shield-exclamation"></i>
            </div>
            <h2>Acesso Negado</h2>
            <p>Você não tem permissão para acessar esta página.</p>
        </div>
        <div class="error-body">
            <a href="/dashboard" class="btn btn-primary" data-testid="btn-voltar-dashboard">
                <i class="bi bi-house me-2"></i> Voltar ao Dashboard
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
