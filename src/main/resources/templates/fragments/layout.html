<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - AccessGuard'">AccessGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --border-color: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-primary: #38bdf8;
            --accent-primary-hover: #0ea5e9;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #06b6d4;
        }
        body { background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .sidebar { min-height: 100vh; background: var(--bg-dark); border-right: 1px solid var(--border-color); }
        .main-content { flex: 1; background: #0b1220; }
        .nav-link { color: var(--text-secondary) !important; border-radius: 0.5rem; margin-bottom: 0.25rem; transition: all 0.2s ease; }
        .nav-link:hover { background: var(--bg-card); color: var(--text-primary) !important; }
        .nav-link.active { background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(56, 189, 248, 0.05)); color: var(--accent-primary) !important; border-left: 3px solid var(--accent-primary); }
        .nav-link i { width: 1.25rem; text-align: center; }
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.2); }
        .card-header { background: transparent; border-bottom: 1px solid var(--border-color); border-radius: 0.75rem 0.75rem 0 0 !important; }
        .card-body { padding: 1.5rem; }
        .table { color: var(--text-primary); margin-bottom: 0; }
        .table thead th { background: var(--bg-dark); border-bottom: 2px solid var(--border-color); color: var(--text-secondary); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 1rem; }
        .table tbody td { border-bottom: 1px solid var(--border-color); padding: 1rem; vertical-align: middle; }
        .table tbody tr:hover { background: var(--bg-card-hover); }
        .table-striped > tbody > tr:nth-of-type(odd) { background: rgba(30, 41, 59, 0.5); }
        .badge { font-weight: 500; padding: 0.375rem 0.75rem; border-radius: 9999px; font-size: 0.7rem; letter-spacing: 0.025em; }
        .badge-role-admin { background: linear-gradient(135deg, #dc2626, #991b1b); color: white; }
        .badge-role-auditor { background: linear-gradient(135deg, #f59e0b, #b45309); color: white; }
        .badge-role-colaborador { background: linear-gradient(135deg, #38bdf8, #0ea5e9); color: white; }
        .badge-status-ativo { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; }
        .badge-status-bloqueado { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .badge-evento-sucesso { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; }
        .badge-evento-falha { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .badge-evento-aviso { background: linear-gradient(135deg, #f59e0b, #b45309); color: white; }
        .badge-evento-info { background: linear-gradient(135deg, #06b6d4, #0891b2); color: white; }
        .badge-evento-neutro { background: linear-gradient(135deg, #64748b, #475569); color: white; }
        .form-control, .form-select { background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 0.5rem; padding: 0.625rem 1rem; transition: all 0.2s ease; }
        .form-control:focus, .form-select:focus { background: var(--bg-dark); border-color: var(--accent-primary); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); color: var(--text-primary); }
        .form-control::placeholder { color: var(--text-secondary); opacity: 0.7; }
        .form-label { color: var(--text-primary); font-weight: 500; font-size: 0.875rem; margin-bottom: 0.375rem; }
        .form-text { color: var(--text-secondary); font-size: 0.75rem; }
        .btn { border-radius: 0.5rem; font-weight: 500; padding: 0.5rem 1rem; transition: all 0.2s ease; }
        .btn-primary { background: linear-gradient(135deg, var(--accent-primary), var(--accent-primary-hover)); border: none; }
        .btn-primary:hover { background: linear-gradient(135deg, var(--accent-primary-hover), #0284c7); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3); }
        .btn-outline-primary { border-color: var(--accent-primary); color: var(--accent-primary); }
        .btn-outline-primary:hover { background: var(--accent-primary); border-color: var(--accent-primary); color: #0f172a; }
        .btn-outline-secondary { border-color: var(--border-color); color: var(--text-secondary); }
        .btn-outline-secondary:hover { background: var(--bg-card-hover); border-color: var(--text-secondary); color: var(--text-primary); }
        .btn-outline-success { border-color: var(--success); color: var(--success); }
        .btn-outline-success:hover { background: var(--success); color: white; }
        .btn-outline-danger { border-color: var(--danger); color: var(--danger); }
        .btn-outline-danger:hover { background: var(--danger); color: white; }
        .btn-sm { padding: 0.375rem 0.75rem; font-size: 0.8125rem; }
        .btn-group-sm > .btn { padding: 0.25rem 0.5rem; font-size: 0.8125rem; }
        .pagination .page-link { background: var(--bg-card); border-color: var(--border-color); color: var(--text-primary); }
        .pagination .page-link:hover { background: var(--bg-card-hover); border-color: var(--accent-primary); color: var(--accent-primary); }
        .pagination .page-item.active .page-link { background: var(--accent-primary); border-color: var(--accent-primary); color: #0f172a; }
        .pagination .page-item.disabled .page-link { background: var(--bg-dark); border-color: var(--border-color); color: var(--text-secondary); opacity: 0.5; }
        .alert { border: none; border-radius: 0.75rem; padding: 1rem 1.25rem; }
        .alert-success { background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(34, 197, 94, 0.05)); border-left: 4px solid var(--success); color: var(--success); }
        .alert-danger { background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(239, 68, 68, 0.05)); border-left: 4px solid var(--danger); color: var(--danger); }
        .btn-close { filter: invert(1) grayscale(100%) brightness(200%); opacity: 0.7; }
        .btn-close:hover { opacity: 1; }
        .text-truncate { max-width: 300px; }
        .dl-row dt { color: var(--text-secondary); font-weight: 500; }
        .dl-row dd { color: var(--text-primary); }
        .card-title { color: var(--text-primary); font-weight: 600; font-size: 1rem; }
        h1, h2, h3, h4, h5, h6 { color: var(--text-primary); font-weight: 600; }
        .text-muted { color: var(--text-secondary) !important; }
        .bg-primary { background: linear-gradient(135deg, var(--accent-primary), var(--accent-primary-hover)) !important; }
        .bg-secondary { background: linear-gradient(135deg, #64748b, #475569) !important; }
        .bg-light { background: var(--bg-card) !important; }
        .table-light { background: var(--bg-dark) !important; }
        @media (max-width: 767.98px) {
            .sidebar { position: fixed; top: 0; left: -250px; z-index: 1050; width: 250px; transition: left 0.3s ease; }
            .sidebar.show { left: 0; }
        }
    </style>
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar p-3" style="width: 250px;" sec:authorize="isAuthenticated()">
            <div class="mb-4">
                <h4 class="mb-0"><i class="bi bi-shield-lock text-info"></i> <span class="fw-bold" style="background: linear-gradient(135deg, var(--accent-primary), #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">AccessGuard</span></h4>
                <small class="text-secondary">Sistema IAM Corporativo</small>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="/dashboard" data-testid="nav-dashboard">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/admin/usuarios" data-testid="nav-admin">
                        <i class="bi bi-people-gear"></i> Admin Usuários
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'AUDITOR')">
                    <a class="nav-link" href="/auditoria" data-testid="nav-auditoria">
                        <i class="bi bi-journal-text"></i> Auditoria
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/perfil" data-testid="nav-perfil">
                        <i class="bi bi-person"></i> Meu Perfil
                    </a>
                </li>
            </ul>
            <hr style="border-color: var(--border-color);">
            <div class="text-center">
                <form action="/logout" method="post" data-testid="logout-form">
                    <button type="submit" class="btn btn-outline-danger w-100" data-testid="btn-logout">
                        <i class="bi bi-box-arrow-right"></i> Sair
                    </button>
                </form>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content p-4" style="width: 100%;">
            <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show" role="alert" data-testid="alert-success">
                Logout realizado com sucesso
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert" data-testid="alert-success">
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert" data-testid="alert-error">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:fragment="content"></div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
