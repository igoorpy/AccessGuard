<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - AccessGuard'">AccessGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .sidebar { min-height: 100vh; background: #f8f9fa; border-right: 1px solid #dee2e6; }
        .main-content { flex: 1; }
        .nav-link.active { background: #e7f1ff; color: #0d6efd !important; }
    </style>
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar p-3" style="width: 250px;" sec:authorize="isAuthenticated()">
            <div class="mb-4">
                <h4 class="mb-0 text-primary"><i class="bi bi-shield-lock"></i> AccessGuard</h4>
                <small class="text-muted">Sistema IAM Corporativo</small>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="/dashboard" data-testid="nav-dashboard">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/admin/usuarios" data-testid="nav-admin">
                        <i class="bi bi-people-gear"></i> Admin Usuários
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'AUDITOR')">
                    <a class="nav-link" href="/auditoria" data-testid="nav-auditoria">
                        <i class="bi bi-journal-text"></i> Auditoria
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/perfil" data-testid="nav-perfil">
                        <i class="bi bi-person"></i> Meu Perfil
                    </a>
                </li>
            </ul>
            <hr>
            <div class="text-center">
                <form action="/logout" method="post" data-testid="logout-form">
                    <button type="submit" class="btn btn-outline-danger w-100" data-testid="btn-logout">
                        <i class="bi bi-box-arrow-right"></i> Sair
                    </button>
                </form>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content p-4" style="width: 100%;">
            <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show" role="alert" data-testid="alert-success">
                Logout realizado com sucesso
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert" data-testid="alert-success">
                <span th:text="${message}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert" data-testid="alert-error">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:fragment="content"></div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
