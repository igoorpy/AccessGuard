<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AccessGuard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-primary: #38bdf8;
            --accent-primary-hover: #0ea5e9;
            --success: #22c55e;
            --danger: #ef4444;
            --radius-lg: 1rem;
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg-dark); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .login-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); box-shadow: var(--shadow-xl), 0 0 0 1px rgba(56, 189, 248, 0.1); max-width: 440px; width: 100%; overflow: hidden; }
        .login-header { background: linear-gradient(135deg, rgba(56, 189, 248, 0.1), rgba(6, 182, 212, 0.05)); border-bottom: 1px solid var(--border-color); padding: 2rem; text-align: center; }
        .login-header .icon { width: 80px; height: 80px; border-radius: 1rem; background: linear-gradient(135deg, var(--accent-primary), #06b6d4); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; box-shadow: 0 8px 24px rgba(56, 189, 248, 0.3); }
        .login-header .icon i { font-size: 2.5rem; color: #0f172a; }
        .login-header h3 { color: var(--text-primary); font-weight: 700; font-size: 1.5rem; margin-bottom: 0.25rem; }
        .login-header p { color: var(--text-secondary); font-size: 0.875rem; margin: 0; }
        .login-body { padding: 2rem; }
        .form-label { color: var(--text-primary); font-weight: 500; font-size: 0.875rem; margin-bottom: 0.5rem; }
        .form-control { background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 0.5rem; padding: 0.75rem 1rem; transition: all 0.2s ease; }
        .form-control:focus { background: var(--bg-dark); border-color: var(--accent-primary); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); color: var(--text-primary); outline: none; }
        .form-control::placeholder { color: var(--text-secondary); opacity: 0.6; }
        .btn-primary { background: linear-gradient(135deg, var(--accent-primary), var(--accent-primary-hover)); border: none; border-radius: 0.5rem; padding: 0.875rem 1.5rem; font-weight: 600; font-size: 0.9375rem; width: 100%; transition: all 0.2s ease; }
        .btn-primary:hover { background: linear-gradient(135deg, var(--accent-primary-hover), #0284c7); transform: translateY(-1px); box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3); }
        .btn-primary:active { transform: translateY(0); }
        .alert { border: none; border-radius: 0.5rem; padding: 0.875rem 1rem; margin-bottom: 1rem; font-size: 0.875rem; }
        .alert-danger { background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(239, 68, 68, 0.05)); border-left: 4px solid var(--danger); color: #fca5a5; }
        .alert-success { background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(34, 197, 94, 0.05)); border-left: 4px solid var(--success); color: #86efac; }
        .footer-links { margin-top: 1.5rem; text-align: center; }
        .footer-links a { color: var(--text-secondary); font-size: 0.8125rem; text-decoration: none; transition: color 0.2s; }
        .footer-links a:hover { color: var(--accent-primary); }
    </style>
</head>
<body>
    <div class="card login-card">
        <div class="login-header">
            <div class="icon">
                <i class="bi bi-shield-lock"></i>
            </div>
            <h3>AccessGuard</h3>
            <p>Sistema IAM Corporativo</p>
        </div>
        <div class="login-body">
            <div th:if="${error}" class="alert alert-danger" role="alert" data-testid="login-error">
                <span th:text="${error}"></span>
            </div>
            <div th:if="${message}" class="alert alert-success" role="alert" data-testid="login-success">
                <span th:text="${message}"></span>
            </div>

            <form th:action="@{/login}" method="post" data-testid="login-form">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required autofocus data-testid="input-email" placeholder="seu@email.com">
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" name="password" required data-testid="input-password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" data-testid="btn-login">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Entrar
                </button>
            </form>

            <div class="footer-links">
                <a href="#" onclick="return false;">Esqueceu a senha?</a> · <a href="#" onclick="return false;">Contato</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
