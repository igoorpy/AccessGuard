<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6" lang="pt-BR">
<head th:replace="~{fragments/layout :: head}">
    <title>Dashboard - AccessGuard</title>
</head>
<body>
    <div th:replace="~{fragments/layout :: content}">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Dashboard</h1>
            <span class="badge bg-primary" th:text="${usuario.role}">COLABORADOR</span>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Informações do Usuário</h5>
                        <table class="table table-borderless mb-0">
                            <tr><th scope="row" style="width: 150px;">Nome</th><td th:text="${usuario.nome}"></td></tr>
                            <tr><th scope="row">Email</th><td th:text="${usuario.email}"></td></tr>
                            <tr><th scope="row">Perfil</th><td><span class="badge bg-secondary" th:text="${usuario.role}"></span></td></tr>
                            <tr><th scope="row">Status</th><td>
                                <span class="badge" th:class="${usuario.status == 'ATIVO' ? 'bg-success' : 'bg-danger'}" th:text="${usuario.status}"></span>
                            </td></tr>
                            <tr><th scope="row">Último Login</th><td th:text="${#temporals.format(usuario.ultimoLoginEm, 'dd/MM/yyyy HH:mm')}"></td></tr>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Ações Rápidas</h5>
                        <div class="d-grid gap-2">
                            <a href="/perfil" class="btn btn-outline-primary" data-testid="btn-perfil">
                                <i class="bi bi-person"></i> Meu Perfil
                            </a>
                            <a sec:authorize="hasRole('ADMIN')" href="/admin/usuarios" class="btn btn-outline-secondary" data-testid="btn-admin">
                                <i class="bi bi-people-gear"></i> Admin Usuários
                            </a>
                            <a sec:authorize="hasAnyRole('ADMIN', 'AUDITOR')" href="/auditoria" class="btn btn-outline-secondary" data-testid="btn-auditoria">
                                <i class="bi bi-journal-text"></i> Auditoria
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
