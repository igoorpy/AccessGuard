version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: accessguard-postgres
    environment:
      POSTGRES_DB: accessguard
      POSTGRES_USER: accessguard
      POSTGRES_PASSWORD: accessguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessguard -d accessguard"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata: